# Render Blueprint — creates both services in one step. In the Render
# dashboard: New > Blueprint > select this repo. Render reads this file
# automatically.
#
# The database is deliberately NOT defined here — it uses a free Neon
# Postgres project instead of Render's own Postgres, which stops working
# (and gets deleted) after 30 days on the free plan. Create the Neon
# database separately and paste its connection string into DATABASE_URL
# below once the service exists (marked `sync: false`, so Render won't
# try to manage it and won't ever see the value except in your dashboard).
services:
  - type: web
    name: geriatric-grooves-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=shared && npm run db:generate --workspace=backend && npm run db:deploy --workspace=backend && npm run build --workspace=backend
    startCommand: npm run start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: geriatric-grooves-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: geriatric-grooves-frontend
    env: static
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: geriatric-grooves-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
